name: cliperz-bot
# Runs the call-out bot once every 5 minutes on GitHub's free runners (public repo = unlimited minutes).
# Kill switch: add an empty file named STOP to the repo root and posting stops.
on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: cliperz-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    env:
      X_CLIENT_ID: ${{ secrets.X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.X_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
      TOKEN_KEY: ${{ secrets.TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Cache browser for the card pictures
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Install card renderer and fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Restore X login (encrypted in the repo)
        run: |
          mkdir -p ~/.config/cliperz-bot && chmod 700 ~/.config/cliperz-bot
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TOKEN_KEY -in state/tokens.enc -out ~/.config/cliperz-bot/tokens.json
          chmod 600 ~/.config/cliperz-bot/tokens.json
      - name: Run the bot once
        run: python3 bot/bot.py
      - name: Save X login (re-encrypted) and bot state
        if: always()
        run: |
          if [ -s ~/.config/cliperz-bot/tokens.json ]; then
            openssl enc -aes-256-cbc -pbkdf2 -iter 200000 -salt -pass env:TOKEN_KEY -in ~/.config/cliperz-bot/tokens.json -out state/tokens.enc
          fi
          git config user.name "cliperz-bot"
          git config user.email "cliperz-bot@users.noreply.github.com"
          git add calls.csv state/tokens.enc state/watch.json state/scoreboard-* 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -q -m "bot state"
            git pull --rebase -q || true
            git push -q
          fi
