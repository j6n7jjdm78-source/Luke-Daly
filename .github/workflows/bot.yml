name: cliperz-bot
# Runs the call-out bot on GitHub's free runners (public repo = unlimited minutes).
# Each run stays alive ~28 minutes and runs the bot about once a minute inside it; the next run queues right behind it.
# Kill switch: add an empty file named STOP to the repo root and posting stops.
# Secrets use a CLIPERZ_ prefix so they never collide with the other project's TELEGRAM_* secrets in this repo.
# Run it by hand with mode=check to see which secrets are present (prints only "set" or "MISSING", never the values).
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      mode:
        description: "check = verify the secrets, test = verify the login + X + Telegram (posts nothing public), run = run the bot"
        default: "check"
        type: choice
        options: [check, test, run]
permissions:
  contents: write
concurrency:
  group: cliperz-bot
  cancel-in-progress: false
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 34
    env:
      X_CLIENT_ID: ${{ secrets.CLIPERZ_X_CLIENT_ID }}
      X_CLIENT_SECRET: ${{ secrets.CLIPERZ_X_CLIENT_SECRET }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.CLIPERZ_TG_BOT_TOKEN }}
      TELEGRAM_CHAT_ID: ${{ secrets.CLIPERZ_TG_CHAT_ID }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.CLIPERZ_TG_OWNER_CHAT_ID }}
      TOKEN_KEY: ${{ secrets.CLIPERZ_TOKEN_KEY }}
    steps:
      - uses: actions/checkout@v4
      - name: Check secrets (prints only set / MISSING)
        run: |
          for v in X_CLIENT_ID X_CLIENT_SECRET TELEGRAM_BOT_TOKEN TELEGRAM_CHAT_ID TELEGRAM_OWNER_CHAT_ID TOKEN_KEY; do
            if [ -n "${!v}" ]; then echo "$v: set"; else echo "$v: MISSING"; fi
          done
          [ -f state/tokens.enc ] && echo "state/tokens.enc: present" || echo "state/tokens.enc: MISSING"
      - name: Stop here in check mode
        if: ${{ github.event.inputs.mode == 'check' }}
        run: echo "check mode - not running the bot"
      - uses: actions/setup-python@v5
        if: ${{ github.event.inputs.mode != 'check' }}
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'test' }}
        with:
          node-version: "20"
      - name: Cache browser for the card pictures
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'test' }}
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-chromium-v1
      - name: Install card renderer and fonts
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'test' }}
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq fonts-liberation fonts-dejavu-core fonts-noto-color-emoji
          npm install --no-save --silent playwright@1.49.1
          npx playwright install --with-deps chromium
      - name: Restore X login (encrypted in the repo)
        if: ${{ github.event.inputs.mode != 'check' }}
        run: |
          mkdir -p ~/.config/cliperz-bot && chmod 700 ~/.config/cliperz-bot
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 200000 -pass env:TOKEN_KEY -in state/tokens.enc -out ~/.config/cliperz-bot/tokens.json
          chmod 600 ~/.config/cliperz-bot/tokens.json
      - name: Run the bot about once a minute for ~28 minutes
        if: ${{ github.event.inputs.mode != 'check' && github.event.inputs.mode != 'test' }}
        run: |
          END=$((SECONDS + 1680))
          while [ $SECONDS -lt $END ]; do
            T0=$SECONDS
            git fetch -q origin main 2>/dev/null && git cat-file -e origin/main:STOP 2>/dev/null && touch STOP   # kill switch from the repo
            BEFORE="$(wc -l < calls.csv) $(md5sum ~/.config/cliperz-bot/tokens.json | cut -d' ' -f1) $(grep -c 'hit' calls.csv) $(ls state | md5sum | cut -c1-8)"
            python3 bot/bot.py || echo "bot run failed, will retry next minute"
            AFTER="$(wc -l < calls.csv) $(md5sum ~/.config/cliperz-bot/tokens.json | cut -d' ' -f1) $(grep -c 'hit' calls.csv) $(ls state | md5sum | cut -c1-8)"
            [ "$BEFORE" != "$AFTER" ] && bash deploy/save_state.sh   # new call, milestone, or refreshed login: save right away
            USED=$((SECONDS - T0)); [ $USED -lt 60 ] && sleep $((60 - USED)); true
          done
      - name: Test the login, X and Telegram (test mode only; posts nothing public)
        if: ${{ github.event.inputs.mode == 'test' }}
        run: |
          python3 - <<'PY'
          import sys; sys.path.insert(0, "bot")
          import bot
          me = bot.http("https://api.x.com/2/users/me", headers={"Authorization": "Bearer " + bot.token()})["data"]
          print("X login OK, account:", me["username"])
          bot.DRY = False
          bot.owner_msg("✅ GitHub test: the cloud copy can log in to X and message you. Nothing public was posted.")
          print("Telegram DM sent (check your private chat with the bot)")
          PY
      - name: Save X login (re-encrypted) and bot state
        if: ${{ always() && github.event.inputs.mode != 'check' }}
        run: bash deploy/save_state.sh
