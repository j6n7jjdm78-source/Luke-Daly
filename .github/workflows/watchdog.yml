name: cliperz-watchdog
# Every 30 minutes: checks that the bot job is alive and saving state; sends ONE private Telegram DM (at most every 2 hours) if it looks stalled.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      GITHUB_TOKEN: ${{ github.token }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.CLIPERZ_TG_BOT_TOKEN }}
      TELEGRAM_OWNER_CHAT_ID: ${{ secrets.CLIPERZ_TG_OWNER_CHAT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Check the bot
        run: python3 deploy/watchdog.py
