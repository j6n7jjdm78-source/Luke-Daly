name: Scan markets
on:
  schedule:
    - cron: "*/15 * * * *"   # every 15 minutes
  workflow_dispatch:
    inputs:
      mode:
        description: "scan | test | chat-id | backtest"
        default: "test"
        type: choice
        options: [test, chat-id, scan, backtest]
concurrency: scan
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PIPS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PIPS_CHAT_ID }}
          DATA_SOURCE: public
        run: |
          case "${{ github.event.inputs.mode || 'scan' }}" in
            test) python -m scanner.main --test ;;
            chat-id) python -m scanner.main --chat-id ;;
            backtest) python -m scanner.backtest --days 90 --min-touches 2 3 4 ;;
            *) python -m scanner.main --once --source public ;;
          esac
