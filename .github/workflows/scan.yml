name: Scan markets
on:
  schedule:
    - cron: "*/5 * * * *"    # every 5 minutes: full scan on the quarter hour, trade tracking in between
  workflow_dispatch:
    inputs:
      mode:
        description: "scan | track | test | chat-id | backtest"
        default: "test"
        type: choice
        options: [test, chat-id, scan, track, backtest]
concurrency: scan
jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - run: pip install -r requirements.txt
      - uses: actions/cache@v4
        with:
          path: state.json
          key: state-${{ github.run_id }}
          restore-keys: state-
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.PIPS_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.PIPS_CHAT_ID }}
          DATA_SOURCE: public
        run: |
          case "${{ github.event.inputs.mode || 'scan' }}" in
            test) python -m scanner.main --test ;;
            chat-id) python -m scanner.main --chat-id ;;
            backtest) python -m scanner.backtest --days 90 --sweep ;;
            track) python -m scanner.main --once --track --source public ;;
            *)
              # scheduled runs: full scan in the first 5 minutes of each quarter hour, otherwise only follow open trades
              if [ "${{ github.event_name }}" = "schedule" ] && [ $(( 10#$(date -u +%M) % 15 )) -ge 5 ]; then
                python -m scanner.main --once --track --source public
              else
                python -m scanner.main --once --source public
              fi ;;
          esac
