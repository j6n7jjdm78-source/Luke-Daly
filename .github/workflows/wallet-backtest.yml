name: wallet-backtest
# Manual only. Read-only: fetches public candles, runs the exit-rule backtest on calls.csv, uploads the report. No keys, no trading.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m wallet.backtest --out wallet/state/backtest_report.md
      - run: cat wallet/state/backtest_report.md >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: wallet/state/backtest_report.md
