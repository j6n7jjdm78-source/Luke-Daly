name: wallet-backtest
# Manual only. Read-only: fetches public candles, runs the exit-rule backtest on calls.csv, uploads the report. No keys, no trading.
on:
  workflow_dispatch:
  push:   # runs once on the dev branch when this file changes (dispatch needs the file on main)
    branches: [claude/ecstatic-carson-wzud1x]
    paths: ['.github/workflows/wallet-backtest.yml', 'wallet/backtest.py']
permissions:
  contents: write   # only to commit the report file back to this branch
jobs:
  backtest:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - run: python -m wallet.backtest --out wallet/state/backtest_report.md
      - run: cat wallet/state/backtest_report.md >> "$GITHUB_STEP_SUMMARY"
      - name: Commit the report to the branch so it can be read
        run: |
          git config user.name "wallet-backtest"; git config user.email "wallet-backtest@users.noreply.github.com"
          git add -f wallet/state/backtest_report.md
          git commit -m "Backtest report (automated)" || true
          git push || true
      - uses: actions/upload-artifact@v4
        with:
          name: backtest-report
          path: wallet/state/backtest_report.md
