name: tests
# Runs the bot's automated tests on every pull request so a bug like the "$85 billion peak" is caught before it is merged.
on:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pytest
      - run: python -m pytest tests/test_cliperz_bot.py tests/test_watchdog.py tests/test_narrative.py tests/test_backtest.py -q
